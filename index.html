function calculateDailyReward(progress) {
    if (progress < 80) {
        return { xp: 0, coins: 0, tier: 'none', label: 'Meta não atingida' };
    }
    if (progress < 90) {
        return { xp: 100, coins: 100, tier: 'complete', label: 'Dia concluído' };
    }
    if (progress < 100) {
        return { xp: 150, coins: 150, tier: 'excellent', label: 'Excelente' };
    }
    return { xp: 250, coins: 250, tier: 'perfect', label: 'Dia perfeito' };
}

function getDailyRewardStatus(progress) {
    if (progress < 80) {
        return {
            eligible: false,
            xp: 0,
            coins: 0,
            message: `Faltam ${Math.max(0, 80 - progress)}% para garantir sua recompensa.`
        };
    }
    const reward = calculateDailyReward(progress);
    return {
        eligible: true,
        xp: reward.xp,
        coins: reward.coins,
        message: `${reward.label}: +${reward.xp} XP e +${reward.coins} Ouro`
    };
}

function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}

function daily(){
  let all=[...S.hygiene, ...S.college, ...S.houseTasks, ...S.habits, ...S.tasks, ...S.nutrition];
  return pct(all.filter(x=>x.completed||x.done).length, all.length);
}

function xpToday(){return [...S.hygiene, ...S.college, ...S.houseTasks, ...S.habits].filter(x=>x.completed).reduce((a,x)=>a+x.xp,0)+S.tasks.filter(x=>x.done).reduce((a,x)=>a+x.xp,0)}

function createDailySnapshot(){
  return {date:today(),progress:daily(),xp:xpToday(),level:S.player.level,coins:S.player.coins,tasks:{hygiene:clone(S.hygiene),college:clone(S.college),houseTasks:clone(S.houseTasks),habits:clone(S.habits),tasks:clone(S.tasks),nutrition:clone(S.nutrition),quests:clone(S.quests)}};
}

function archiveCurrentDay(dateKey){
  if(!dateKey) return;

  const existing = S.history[dateKey];
  const progress = daily();

  // Guarda um retrato detalhado do dia anterior.
  S.history[dateKey] = {
    date: dateKey,
    progress: progress,
    xp: xpToday(),
    level: S.player.level,
    coins: S.player.coins,
    tasks: {
      hygiene: clone(S.hygiene),
      college: clone(S.college),
      houseTasks: clone(S.houseTasks),
      habits: clone(S.habits),
      tasks: clone(S.tasks),
      nutrition: clone(S.nutrition),
      quests: clone(S.quests)
    }
  };
}

function resetDailyTasks(){
  if(S.hygiene) S.hygiene.forEach(x => x.completed = false);
  if(S.college) S.college.forEach(x => x.completed = false);
  if(S.houseTasks) S.houseTasks.forEach(x => x.completed = false);
  if(S.habits) S.habits.forEach(x => x.completed = false);
  if(S.tasks) S.tasks.forEach(x => x.done = false);
  if(S.nutrition) S.nutrition.forEach(x => x.completed = false);
  if(S.quests) S.quests.forEach(x => x.done = false);
}

function checkDailyReset() {
  const d = today();
  const lastActive = localStorage.getItem('eliteLastActiveDate');

  if (S.player.lastQualifiedDay !== d && S.player.dailyRewardClaimed) {
    S.player.dailyRewardClaimed = false;
  }

  // Primeira abertura: apenas registra a data.
  if(!lastActive){
    localStorage.setItem('eliteLastActiveDate', d);
    save();
    return;
  }

  // Novo dia: arquiva o anterior e reseta SOMENTE as tarefas diárias.
  if(lastActive !== d){
    archiveCurrentDay(lastActive);
    resetDailyTasks();
    localStorage.setItem('eliteLastActiveDate', d);
    save();
  }
}

function streakUpdate(){
 const d=today();
 const p=daily();

 S.history[d]=createDailySnapshot();

 if(S.player.dailyRewardClaimed){
   save();
   return;
 }

 if(p < 80){
   save();
   return;
 }

 const reward = calculateDailyReward(p);

 const y=new Date();
 y.setDate(y.getDate()-1);
 const yd=y.toISOString().slice(0,10);

 S.player.streak =
   S.player.lastQualifiedDay===yd
     ? S.player.streak+1
     : 1;

 S.player.bestStreak=Math.max(
   S.player.bestStreak,
   S.player.streak
 );

 S.player.total80Days++;

 if(p===100){
   S.player.totalPerfectDays++;
 }

 S.player.lastQualifiedDay=d;

 S.player.coins += reward.coins;
 xpGain(reward.xp,'discipline');

 S.player.dailyRewardClaimed=true;

 if(p===100){
   toast('👑 DIA PERFEITO! +250 XP +250 Ouro • Streak +1');
 }else if(p>=90){
   toast('⭐ EXCELENTE! +150 XP +150 Ouro • Streak +1');
 }else{
   toast('🎉 META DIÁRIA ATINGIDA! +100 XP +100 Ouro • Streak +1');
 }

 save();
}

function money(n){return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function historyProgress(v){return typeof v==='object'&&v!==null?Number(v.progress||0):Number(v||0)}
function historyXP(v){return typeof v==='object'&&v!==null?Number(v.xp||0):0}
function historyCoins(v){return typeof v==='object'&&v!==null?Number(v.coins||0):0}
function weekAvg(){return avg(Object.entries(S.history||{}).filter(([d])=>daysAgo(d)<7).map(x=>historyProgress(x[1])))}
function monthAvg(){let n=new Date();return avg(Object.entries(S.history||{}).filter(([d])=>{let x=new Date(d+'T12:00:00');return x.getFullYear()===n.getFullYear()&&x.getMonth()===n.getMonth()}).map(x=>historyProgress(x[1])))}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+Number(y),0)/a.length):0}
function daysAgo(d){return Math.floor((new Date()-new Date(d+'T12:00:00'))/86400000)}
function historyTaskDetails(v){let t=v?.tasks;if(!t)return '<div class="muted">Registro antigo sem detalhamento das tarefas.</div>';let groups=[['🧼 Higiene',t.hygiene],['🎓 Faculdade',t.college],['🏠 Casa',t.houseTasks],['🔄 Hábitos',t.habits],['🎯 Tarefas',t.tasks],['🥗 Nutrição',t.nutrition],['⚔️ Missões',t.quests]].filter(x=>Array.isArray(x[1])&&x[1].length);return '<div class="history-task-groups">'+groups.map(([name,list])=>'<div class="history-task-group"><h4>'+name+'</h4>'+list.map(x=>{let done=!!(x.completed||x.done);return '<div class="history-task '+(done?'':'pending')+'">'+(done?'✅':'❌')+' '+(x.name||'Tarefa')+'</div>'}).join('')+'</div>').join('')+'</div>'}
function calendar(){let out='<div class="calendar">'+['D','S','T','Q','Q','S','S'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=29;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10),v=historyProgress(S.history[k]);out+=`<div class="day ${v===100?'perfect':v>=80?'good':v>0?'bad':''}" title="${k}: ${v}%">${v||''}</div>`}return out+'</div>'}
function historyTable(){let a=Object.entries(S.history||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,365);if(!a.length)return '<div class="empty">Ainda não há histórico.</div>';return '<div class="history-list">'+a.map(([date,value],i)=>{let p=historyProgress(value),xp=historyXP(value),coins=historyCoins(value);return `<details class="history-day" ${i===0?'open':''}><summary><b>${date}</b><strong>${p}%</strong><span>${p>=100?'🏆 Perfeito':p>=80?'✅ Qualificado':'—'}</span></summary><div class="history-day-content"><div class="history-stats"><div><span>⭐ XP</span><strong>+${fmt(xp)}</strong></div><div><span>🪙 Gold</span><strong>${fmt(coins)}</strong></div><div><span>📊 Progresso</span><strong>${p}%</strong></div><div><span>👤 Nível</span><strong>${typeof value==='object'&&value?value.level:'—'}</strong></div></div>${historyTaskDetails(value)}</div></details>`}).join('')+'</div>'}
function historyView(){let a=Object.entries(S.history||{}),xp=a.reduce((s,[,v])=>s+historyXP(v),0),coins=a.reduce((s,[,v])=>s+historyCoins(v),0),perfect=a.filter(([,v])=>historyProgress(v)>=100).length;return `${baseHeader('📜 Histórico','Seu diário de evolução, salvo na nuvem.')}<div class="grid"><div class="card"><span class="label">Dias registrados</span><div class="value">${a.length}</div></div><div class="card"><span class="label">Dias perfeitos</span><div class="value gold">${perfect}</div></div><div class="card"><span class="label">XP registrado</span><div class="value">${fmt(xp)}</div></div><div class="card"><span class="label">Gold registrado</span><div class="value gold">${fmt(coins)}</div></div></div><div class="card" style="margin-top:18px"><h3>📖 Diário de evolução</h3><div style="margin-top:15px">${historyTable()}</div></div>`}

function bossView(){let done=S.boss.items.filter(x=>x.done).length,p=pct(done,S.boss.items.length);return `<div class="row"><div><div class="badge gold">👹 BOSS DA SEMANA</div><h2 style="margin-top:9px">O Destruidor da Procrastinação</h2></div><div class="boss-hp">${p}%</div></div><div class="progress"><div class="fill gold" style="width:${p}%"></div></div><div class="boss-tasks">${S.boss.items.map((x,i)=>`<label class="boss-task"><input type="checkbox" data-boss="${i}" ${x.done?'checked':''}> ${x.name}</label>`).join('')}</div>${p===100&&!S.boss.bonusClaimed?'<button class="btn primary" id="claimBoss" style="margin-top:15px">🏆 Derrotar Boss — +500 XP / +1.000 Ouro</button>':''}`}

function showAuth(mode='login',message=''){const o=document.getElementById('authOverlay');o.style.display='flex';o.innerHTML=`<div class="auth-box"><h1>⚔️ ELITEDASH</h1><p>${mode==='login'?'Entre para carregar seu personagem da nuvem.':'Crie sua conta para salvar seu progresso online.'}</p><input id="authEmail" type="email" placeholder="E-mail"><input id="authPassword" type="password" placeholder="Senha"><button class="btn primary" id="authSubmit">${mode==='login'?'Entrar':'Criar conta'}</button><div class="auth-msg">${message}</div><div class="auth-switch"><button id="authToggle">${mode==='login'?'Criar minha conta':'Já tenho uma conta'}</button></div></div>`;document.getElementById('authSubmit').onclick=async()=>{let email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||!password)return showAuth(mode,'Preencha e-mail e senha.');let r=mode==='login'?await supabaseClient.auth.signInWithPassword({email,password}):await supabaseClient.auth.signUp({email,password});if(r.error)return showAuth(mode,r.error.message);if(mode==='login'){currentUser=r.data.user;await loadCloud();checkDailyReset();render('today');o.style.display='none';}else{showAuth('login','Conta criada. Se o Supabase pedir confirmação por e-mail, confirme e depois entre.')}};document.getElementById('authToggle').onclick=()=>showAuth(mode==='login'?'signup':'login')}
async function logout(){await supabaseClient.auth.signOut();currentUser=null;showAuth('login','Você saiu da conta.');}

function render(tabName='today'){
  nav(tabName);
  document.getElementById('app').innerHTML = views[tabName]();
  bind();
}

function bind(){
 document.querySelectorAll('[data-task]').forEach(e=>e.onchange=()=>{
 let x=S.tasks[e.dataset.task];
 x.done=e.checked;
 streakUpdate();
 save();
 render('today');
});
 document.querySelectorAll('[data-habit]').forEach(e=>e.onchange=()=>{
 let x=S.habits[e.dataset.habit];
 x.completed=e.checked;
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-hygiene]').forEach(e=>e.onchange=()=>{
 let x=S.hygiene[e.dataset.hygiene];
 x.completed=e.checked;
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-college]').forEach(e=>e.onchange=()=>{
 let x=S.college[e.dataset.college];
 x.completed=e.checked;
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-housetask]').forEach(e=>e.onchange=()=>{
 let x=S.houseTasks[e.dataset.housetask];
 x.completed=e.checked;
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-nutrition]').forEach(e=>e.onchange=()=>{
 let x=S.nutrition[e.dataset.nutrition];
 x.completed=e.checked;
 streakUpdate();
 save();
 render('nutrition');
});
 document.querySelectorAll('[data-quest]').forEach(e=>e.onchange=()=>{
 let x=S.quests[e.dataset.quest];
 x.done=e.checked;
 save();
 render('quests');
});
 const addQ=document.getElementById('addQuest');if(addQ)addQ.onclick=()=>{let n=document.getElementById('newQuest').value.trim();if(!n)return;S.quests.push({id:Date.now(),name:n,category:document.getElementById('questCat').value,xp:Number(document.getElementById('questXp').value)||50,attr:'career',done:false});save();render('quests')};
 const addB=document.getElementById('addBook');if(addB)addB.onclick=()=>{let n=document.getElementById('bookName').value.trim();if(!n)return;S.books.push({name:n,author:document.getElementById('bookAuthor').value.trim()});xpGain(50,'knowledge');S.player.coins+=50;save();render('knowledge');toast('Livro registrado: +50 XP e +50 Ouro')};
 document.querySelectorAll('[data-delbook]').forEach(e=>e.onclick=()=>{S.books.splice(e.dataset.delbook,1);save();render('knowledge')});
 document.querySelectorAll('[data-fin]').forEach(e=>e.onclick=()=>{S.finances.goals[e.dataset.fin].current=Math.max(0,S.finances.goals[e.dataset.fin].current+Number(e.dataset.d));save();render('finance')});
 const sf=document.getElementById('saveFin');if(sf)sf.onclick=()=>{S.finances.balance=Number(document.getElementById('finBalance').value)||0;S.finances.reserve=Number(document.getElementById('finReserve').value)||0;S.finances.debt=Number(document.getElementById('finDebt').value)||0;save();toast('Tesouraria atualizada');render('finance')};
 document.querySelectorAll('[data-perf]').forEach(e=>e.oninput=()=>{S.performance[e.dataset.perf]=Number(e.value);save()});
 const sw=document.getElementById('saveWeight');if(sw)sw.onclick=()=>{let v=Number(document.getElementById('weight').value);if(v>0){S.weightHistory.push({date:today(),value:v});save();render('performance');toast('Registro corporal salvo no histórico')}};
 document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>{let c=Number(e.dataset.cost);if(S.player.coins<c)return toast('Ouro insuficiente');S.player.coins-=c;S.inventory.push(e.dataset.buy);save();render('store');toast('Recompensa resgatada!')});
 document.querySelectorAll('[data-boss]').forEach(e=>e.onchange=()=>{S.boss.items[e.dataset.boss].done=e.checked;save();render('quests')});
 const cb=document.getElementById('claimBoss');if(cb)cb.onclick=()=>{if(S.boss.items.every(x=>x.done)&&!S.boss.bonusClaimed){S.boss.bonusClaimed=true;xpGain(500,'discipline');S.player.coins+=1000;S.trophies.push('Destruidor da Procrastinação');save();render('quests');toast('BOSS DERROTADO! +500 XP +1.000 Ouro')}};
}
function toast(msg){let c=document.getElementById('toast');c.innerHTML=`<div class="toast"><b>Honra Conquistada</b><span>${msg}</span></div>`;setTimeout(()=>c.innerHTML='',3500)}

(async function initEliteDash(){
  const {data}=await supabaseClient.auth.getSession();
  currentUser=data?.session?.user||null;
  if(!currentUser){showAuth('login');return;}
  await loadCloud();
  checkDailyReset();
  render('today');
})();
</script>
</body>
