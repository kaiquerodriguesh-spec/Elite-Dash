<div id="toast"></div><div id="cloudSyncStatus" aria-live="polite" style="position:fixed;right:16px;bottom:80px;z-index:9998;padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;opacity:.78">☁️ Nuvem pronta</div>

<script>

function calculateDailyReward(progress) {
    if (progress < 80) {
        return { xp: 0, coins: 0, tier: 'none', label: 'Meta não atingida' };
    }
    if (progress < 90) {
        return { xp: 100, coins: 100, tier: 'complete', label: 'Dia concluído' };
    }
    if (progress < 100) {
        return { xp: 150, coins: 150, tier: 'excellent', label: 'Excelente' };
    }
    return { xp: 250, coins: 250, tier: 'perfect', label: 'Dia perfeito' };
}

function getDailyRewardStatus(progress) {
    if (progress < 80) {
        return {
            eligible: false,
            xp: 0,
            coins: 0,
            message: `Faltam ${Math.max(0, 80 - progress)}% para garantir sua recompensa.`
        };
    }
    const reward = calculateDailyReward(progress);
    return {
        eligible: true,
        xp: reward.xp,
        coins: reward.coins,
        message: `${reward.label}: +${reward.xp} XP e +${reward.coins} Ouro`
    };
}

function refreshRewardBanner(){
    const el = document.getElementById('dailyRewardStatus');
    if(!el || typeof daily !== 'function') return;
    const progress = daily();
    const st = getDailyRewardStatus(progress);
    const claimed = (typeof S !== 'undefined' && S.player && S.player.dailyRewardClaimed);
    el.innerHTML = `<div class="reward-label">🎯 Progresso de hoje: ${progress}%</div>`
      + `<div class="reward-sub">${claimed ? '✅ Recompensa do dia já garantida.' : st.message}</div>`;
}


const KEY='eliteMasterDashStateV11';
const ELITE_TZ='America/Sao_Paulo'; // Horário de Brasília — sem DST desde 2019, então é estável o ano todo.
function dateKeyFromDate(d=new Date()){
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:ELITE_TZ,year:'numeric',month:'2-digit',day:'2-digit'
  }).format(d);
}
const today=()=>dateKeyFromDate(new Date());
function yesterdayKey(){
  const current=today();
  const [y,m,d]=current.split('-').map(Number);
  const utcNoon=new Date(Date.UTC(y,m-1,d,12,0,0));
  utcNoon.setUTCDate(utcNoon.getUTCDate()-1);
  return `${utcNoon.getUTCFullYear()}-${String(utcNoon.getUTCMonth()+1).padStart(2,'0')}-${String(utcNoon.getUTCDate()).padStart(2,'0')}`;
}
const fmt=n=>Number(n||0).toLocaleString('pt-BR');
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(prefix){
  if(window.crypto && crypto.randomUUID) return prefix+'_'+crypto.randomUUID();
  return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}
function ensureIds(state){
  ['hygiene','college','houseTasks','habits','tasks','nutrition','quests','books'].forEach(k=>{
    if(Array.isArray(state[k])) state[k].forEach(x=>{ if(!x.id) x.id=uid(k[0]); });
  });
  return state;
}

function renameListItem(listKey, id, tab){
  const list = S[listKey];
  if(!list) return;
  const idx = list.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const cur = list[idx].name || '';
  const input = prompt('Novo nome:', cur);
  if(input===null) return;
  const n = input.trim().slice(0,60);
  if(!n) return;
  list[idx].name = n;
  save();
  render(tab);
}

function deleteListItem(listKey, id, tab){
  const list = S[listKey];
  if(!list) return;
  const idx = list.findIndex(x=>x.id===id);
  if(idx===-1) return;
  if(!confirm(`Remover "${list[idx].name}"? Essa ação não pode ser desfeita.`)) return;
  list.splice(idx,1);
  save();
  render(tab);
}

function renameBook(id){
  const idx = S.books.findIndex(b=>b.id===id);
  if(idx===-1) return;
  const book = S.books[idx];
  const newName = prompt('Título do livro:', book.name);
  if(newName===null) return;
  const n = newName.trim().slice(0,80);
  if(!n) return;
  const newAuthor = prompt('Autor:', book.author||'');
  if(newAuthor===null) return;
  book.name = n;
  book.author = newAuthor.trim().slice(0,80);
  save();
  render('knowledge');
}

function unionById(a=[],b=[]){
  const out=[...a];
  const ids=new Set(a.map(x=>x.id));
  b.forEach(x=>{ if(x && x.id && !ids.has(x.id)){ out.push(x); ids.add(x.id); } });
  return out;
}

function safeMergeStates(local, remote){
  // Parte da versão confirmada mais recente no servidor e reforça por cima
  // qualquer progresso local que ainda não tinha chegado lá — nunca o contrário.
  const merged = clone(remote);

  // Contadores cumulativos: nunca podem regredir num merge.
  merged.player.xp = Math.max(Number(local.player.xp||0), Number(remote.player.xp||0));
  merged.player.coins = Math.max(Number(local.player.coins||0), Number(remote.player.coins||0));
  merged.player.level = Math.max(Number(local.player.level||1), Number(remote.player.level||1));
  merged.player.bestStreak = Math.max(Number(local.player.bestStreak||0), Number(remote.player.bestStreak||0));
  merged.player.total80Days = Math.max(Number(local.player.total80Days||0), Number(remote.player.total80Days||0));
  merged.player.totalPerfectDays = Math.max(Number(local.player.totalPerfectDays||0), Number(remote.player.totalPerfectDays||0));
  merged.player.bossDefeats = Math.max(Number(local.player.bossDefeats||0), Number(remote.player.bossDefeats||0));

  // Recompensa diária: se qualquer um dos dois lados já resgatou hoje, nunca "desresgata".
  merged.player.dailyRewardClaimed = !!(local.player.dailyRewardClaimed || remote.player.dailyRewardClaimed);
  merged.player.dailyRewardDate = [local.player.dailyRewardDate, remote.player.dailyRewardDate].filter(Boolean).sort().pop() || null;

  // Streak/último dia qualificado: prevalece a referência de data mais recente.
  if(String(local.player.lastQualifiedDay||'') > String(remote.player.lastQualifiedDay||'')){
    merged.player.lastQualifiedDay = local.player.lastQualifiedDay;
    merged.player.streak = local.player.streak;
  }

  // Histórico: nunca perder dias. Um dia fechado é imutável e nunca é sobrescrito por um aberto.
  merged.history = { ...(remote.history||{}) };
  Object.entries(local.history||{}).forEach(([d,v])=>{
    const existing = merged.history[d];
    if(!existing){ merged.history[d]=v; return; }
    if(existing.closed===true) return; // servidor já fechou este dia — mantém como está
    if(v && v.closed===true){ merged.history[d]=v; return; } // local fechou e o servidor ainda não sabia
    if(historyProgress(v) > historyProgress(existing)) merged.history[d]=v;
  });

  // Pets/equipamentos/marcos: união sem duplicar.
  merged.pets = unionById(remote.pets||[], local.pets||[]);
  merged.avatar = merged.avatar || {equipped:{helm:null,armor:null,weapon:null,cape:null,aura:null},owned:[]};
  merged.avatar.owned = Array.from(new Set([...(remote.avatar?.owned||[]),...(local.avatar?.owned||[])]));
  merged.milestones = Array.from(new Set([...(remote.milestones||[]),...(local.milestones||[])]));

  return merged;
}

function mergeState(base, saved){
  if(Array.isArray(saved)) return clone(saved);
  if(saved && typeof saved==='object'){
    const out={...(base && typeof base==='object' ? base : {})};
    Object.keys(saved).forEach(k=>{
      out[k]=mergeState(out[k],saved[k]);
    });
    return out;
  }
  return saved===undefined ? clone(base) : saved;
}

function normalizeState(saved){
  const state=mergeState(clone(defaultState),saved||{});
  if(!state.history) state.history={};
  if(!state.quests) state.quests=[];
  if(!state.inventory) state.inventory=[];
  if(!state.dailyStats || typeof state.dailyStats!=='object') state.dailyStats=clone(defaultState.dailyStats);
  if(!Number.isFinite(Number(state.dailyStats.xpEarned))) state.dailyStats.xpEarned=0;
  if(!Number.isFinite(Number(state.dailyStats.coinsEarned))) state.dailyStats.coinsEarned=0;
  if(!state.player.dailyRewardDate && state.player.dailyRewardClaimed && state.player.lastQualifiedDay){
    state.player.dailyRewardDate=state.player.lastQualifiedDay;
  }
  return ensureTaskDefaults(ensureIds(state));
}

function save(){
  localRevision++;
  S._syncRevision=localRevision;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ console.warn('Falha no backup local',e); }
  if(!currentUser) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>saveToCloud(localRevision),250);
}

async function saveToCloud(revision=localRevision){
  if(!currentUser) return;
  if(revision!==localRevision) return;

  // Proteção contra "stale write": se outro dispositivo salvou depois da nossa
  // última leitura conhecida, mesclamos com segurança em vez de sobrescrever.
  try{
    if(lastKnownCloudUpdatedAt){
      const {data:check}=await supabaseClient.from('player_data').select('game_state,updated_at').eq('user_id',currentUser.id).maybeSingle();
      if(check && check.updated_at && check.updated_at>lastKnownCloudUpdatedAt){
        const remote=normalizeState(check.game_state);
        S=safeMergeStates(S,remote);
        toast('🔄 Sincronizado com outro dispositivo — nenhum progresso foi perdido.');
      }
    }
  }catch(e){
    console.warn('Falha ao checar concorrência antes de salvar; salvando mesmo assim.',e);
  }

  const snapshot=clone(S);
  snapshot._syncRevision=revision;
  const {error,data:saved}=await supabaseClient.from('player_data').upsert({
    user_id:currentUser.id,
    game_state:snapshot,
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'}).select('updated_at').maybeSingle();
  const syncEl=document.getElementById('cloudSyncStatus');
  if(error){
    console.error('Erro ao salvar no Supabase:',error);
    if(syncEl) syncEl.textContent='⚠️ Nuvem: erro ao sincronizar';
    toast('⚠️ Sincronização falhou. Seu progresso continua salvo neste navegador.');
  }else{
    lastKnownCloudUpdatedAt = saved?.updated_at || new Date().toISOString();
    if(syncEl) syncEl.textContent='☁️ Salvo na nuvem';
  }
}

async function loadCloud(){
  if(!currentUser) return;
  const {data,error}=await supabaseClient
    .from('player_data')
    .select('game_state,updated_at')
    .eq('user_id',currentUser.id)
    .maybeSingle();

  if(error){
    console.error('Erro ao carregar o Supabase:',error);
    toast('⚠️ Não foi possível carregar a nuvem.');
    return;
  }

  if(data && data.game_state && Object.keys(data.game_state).length){
    S=normalizeState(data.game_state);
    localRevision=Number(S._syncRevision||0);
    lastKnownCloudUpdatedAt=data.updated_at||new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    return;
  }

  // Primeira vez desta conta: envia o progresso local atual (já limpo por logout(),
  // se aplicável) para a nuvem.
  S=normalizeState(S);
  const {error:insertError,data:inserted}=await supabaseClient.from('player_data').insert({
    user_id:currentUser.id,
    game_state:S
  }).select('updated_at').maybeSingle();
  if(insertError){
    console.error('Erro ao criar dados do jogador:',insertError);
    toast('⚠️ Não foi possível criar seu personagem na nuvem.');
  }else{
    lastKnownCloudUpdatedAt = inserted?.updated_at || new Date().toISOString();
  }
}

function ensureDailyStats(){
  const d=today();
  if(!S.dailyStats || S.dailyStats.date!==d){
    const previous=S.dailyStats;
    S.dailyStats={
      date:d,
      startXp:Number(S.player.xp||0),
      startLevel:Number(S.player.level||1),
      startCoins:Number(S.player.coins||0),
      xpEarned:0,
      coinsEarned:0
    };
    // Nunca deixa uma troca de tela/dispositivo apagar o ledger já fechado.
    if(previous && previous.date && previous.date!==d && !S.history[previous.date]){
      S.history[previous.date]={
        ...previous,
        endXp:Number(S.player.xp||0),
        endLevel:Number(S.player.level||1),
        endCoins:Number(S.player.coins||0)
      };
    }
  }
}

function xpGain(amount,attr){
  const n=Math.max(0,Math.round(Number(amount)||0) * (1 + petBuffPct('xp',attr)/100));
  ensureDailyStats();
  S.player.xp+=n;
  S.dailyStats.xpEarned+=n;
  if(attr)S.attributes[attr]=Math.min(100,S.attributes[attr]+Math.max(1,Math.round(n/10)));
  while(S.player.xp>=S.player.maxXp){S.player.xp-=S.player.maxXp;S.player.level++;S.player.maxXp=Math.floor(S.player.maxXp*1.3);toast('LEVEL UP! Nível '+S.player.level+' alcançado!')}
}
function addGold(amount){
  const n=Math.round(Number(amount)||0) * (1 + petBuffPct('gold')/100);
  ensureDailyStats();
  S.player.coins+=n;
  S.dailyStats.coinsEarned+=n;
  return n;
}

function petBuffValue(p){
  const base=PET_RARITY_BASE[p.rarity]||2;
  return base + (p.level-1)*0.6;
}

function petBuffPct(kind, attr){
  let total=0;
  (S.pets||[]).filter(p=>p.active).forEach(p=>{
    const val=petBuffValue(p);
    if(kind==='gold' && p.buffType==='gold') total+=val;
    if(kind==='xp'){
      if(p.buffType==='xp_all') total+=val;
      if(attr && p.buffType==='xp_'+attr) total+=val;
    }
  });
  return total;
}

function petXpGain(amount){
  (S.pets||[]).filter(p=>p.active).forEach(p=>{
    if(p.level>=10) return;
    p.xp+=amount;
    while(p.xp>=p.xpToNext && p.level<10){
      p.xp-=p.xpToNext;
      p.level++;
      p.xpToNext=20+(p.level-1)*15;
      toast(`🐾 ${p.name} subiu para o nível ${p.level}!`);
    }
    if(p.level>=10) p.xp=0;
  });
}

function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}

function xpPendingToday(){return [...S.hygiene, ...S.college, ...S.houseTasks, ...S.habits].filter(x=>!x.completed).reduce((a,x)=>a+x.xp,0)+S.tasks.filter(x=>!x.done).reduce((a,x)=>a+x.xp,0)}

function createDailySnapshot(){
  ensureDailyStats();
  return {
    date:S.dailyStats.date || today(),
    progress:daily(),
    taskXpAvailable:xpPendingToday(),
    xpEarned:Number(S.dailyStats.xpEarned||0),
    coinsEarned:Number(S.dailyStats.coinsEarned||0),
    startXp:Number(S.dailyStats.startXp||0),
    startLevel:Number(S.dailyStats.startLevel||1),
    startCoins:Number(S.dailyStats.startCoins||0),
    endXp:Number(S.player.xp||0),
    endLevel:Number(S.player.level||1),
    endCoins:Number(S.player.coins||0),
    tasks:{
      hygiene:clone(S.hygiene),college:clone(S.college),houseTasks:clone(S.houseTasks),
      habits:clone(S.habits),tasks:clone(S.tasks),nutrition:clone(S.nutrition),quests:clone(S.quests)
    }
  };
}

function archiveCurrentDay(dateKey){
  if(!dateKey) return;
  // Um dia encerrado é imutável. Só o ledger do próprio dia pode fechá-lo.
  const existing=S.history[dateKey];
  if(existing && existing.closed===true) return;

  if(S.dailyStats && S.dailyStats.date===dateKey){
    const snap=createDailySnapshot();
    snap.date=dateKey;
    snap.closed=true;
    snap.closedAt=new Date().toISOString();
    S.history[dateKey]=snap;
    return;
  }

  // Compatibilidade com estados antigos: nunca inventa dados.
  if(!existing){
    S.history[dateKey]={
      date:dateKey,
      progress:0,
      xpEarned:0,
      coinsEarned:0,
      tasks:{},
      closed:true,
      closedAt:new Date().toISOString()
    };
  }
}

function resetDailyTasks(){
  if(S.hygiene) S.hygiene.forEach(x=>x.completed=false);
  if(S.college) S.college.forEach(x=>x.completed=false);
  if(S.houseTasks) S.houseTasks.forEach(x=>x.completed=false);
  if(S.habits) S.habits.forEach(x=>x.completed=false);
  if(S.tasks) S.tasks.forEach(x=>x.done=false);
  if(S.nutrition) S.nutrition.forEach(x=>x.completed=false);
  if(S.quests) S.quests.forEach(x=>x.done=false);
}

function startNewDailyLedger(){
  const d=today();
  S.dailyStats={
    date:d,startXp:Number(S.player.xp||0),startLevel:Number(S.player.level||1),
    startCoins:Number(S.player.coins||0),xpEarned:0,coinsEarned:0
  };
}

function recordToday(){
  ensureDailyStats();
  const d=today();
  if(!S.history || typeof S.history!=='object' || Array.isArray(S.history)) S.history={};
  if(S.history[d] && S.history[d].closed===true) return;
  S.history[d]=createDailySnapshot();
  S.history[d].closed=false;
}

function isoWeekKey(dateKey=today()){
  const [y,m,d]=dateKey.split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,d,12,0,0)); // meio-dia UTC evita qualquer problema de borda/DST
  const dayNum=(t.getUTCDay()+6)%7; // segunda=0 ... domingo=6
  t.setUTCDate(t.getUTCDate()-dayNum+3); // quinta-feira da mesma semana ISO
  const firstThursday=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const firstDayNum=(firstThursday.getUTCDay()+6)%7;
  firstThursday.setUTCDate(firstThursday.getUTCDate()-firstDayNum+3);
  const week=1+Math.round((t-firstThursday)/(7*86400000));
  return `${t.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}

function checkWeeklyReset(){
  const wk = isoWeekKey();
  if(S.boss.week !== wk){
    S.boss.week = wk;
    S.boss.bonusClaimed = false;
    S.boss.hp = S.boss.maxHp || 1000;
    S.boss.items.forEach(i=>i.done=false);
    save();
  }
}

function checkDailyReset() {
  const d = today();
  if(!S.meta) S.meta = {lastCheckedDate:null};
  const lastActive = S.meta.lastCheckedDate;

  if (S.player.lastQualifiedDay !== d && S.player.dailyRewardDate !== d) {
    S.player.dailyRewardClaimed = false;
  }

  // Primeira abertura (nesta conta, em qualquer dispositivo): apenas registra e já contabiliza o dia.
  if(!lastActive){
    S.meta.lastCheckedDate = d;
    ensureDailyStats();
    recordToday();
    save();
    return;
  }

  // Comparação cronológica (strings YYYY-MM-DD comparam corretamente com < e >).
  // CRÍTICO: só considera "novo dia" quando `d` é estritamente POSTERIOR a `lastActive`.
  // Isso evita reset prematuro se `S.meta.lastCheckedDate` vier "adiantado" por qualquer
  // motivo (outro dispositivo com versão em cache antiga, relógio do sistema errado,
  // dado sincronizado antes da correção de fuso horário etc.) — o dia só vira de fato
  // quando o horário de Brasília realmente passar da meia-noite.
  if(d > lastActive){
    archiveCurrentDay(lastActive);
    resetDailyTasks();
    S.meta.lastCheckedDate = d;
    startNewDailyLedger();
    recordToday();
    save();
  }else if(d < lastActive){
    // Data salva está no futuro em relação ao horário real de Brasília agora — não faz
    // nada além de registrar o dia atual sem resetar, e não regride lastCheckedDate
    // (evita ficar alternando reset/não-reset por causa de um valor corrompido).
    recordToday();
    save();
  }else{
    recordToday();
  }
}

  facil:   {label:'Fácil',   icon:'🟢', color:'#34d399', xp:20,  dmg:5},
  normal:  {label:'Normal',  icon:'🔵', color:'#60a5fa', xp:40,  dmg:10},

};

const STREAK_MILESTONES=[3,7,14,30,60,100];

function characterTitle(level){
  if(level>=100) return {icon:'🐉',name:'Lendário'};
  if(level>=75)  return {icon:'👑',name:'Mestre'};
  if(level>=50)  return {icon:'⚔️',name:'Elite'};
  if(level>=25)  return {icon:'🛡️',name:'Guerreiro'};
  if(level>=10)  return {icon:'⚔️',name:'Aventureiro'};
  return {icon:'🧑',name:'Novato'};
}

function nextTitleHint(level){
  const thresholds=[[10,'Aventureiro'],[25,'Guerreiro'],[50,'Elite'],[75,'Mestre'],[100,'Lendário']];
  const next=thresholds.find(([lvl])=>lvl>level);
  return next ? `Faltam ${next[0]-level} níveis para se tornar ${next[1]}.` : 'Você alcançou o nível máximo de evolução do personagem!';
}

function nextStreakMilestone(streak){
  return STREAK_MILESTONES.find(m=>m>streak) || null;
}

function streakDots(streak){
  const next = nextStreakMilestone(streak) || (streak+1);
  const total = Math.min(next, 20); // no máximo 20 pontos visíveis, pra não estourar em telas pequenas
  const filled = Math.min(streak, total);
  return '●'.repeat(filled) + '○'.repeat(Math.max(0,total-filled));
}

function ensureTaskDefaults(state){
  ['tasks','quests'].forEach(k=>{
    if(!Array.isArray(state[k])) return;
    state[k].forEach(x=>{
      if(!x.difficulty || !DIFFICULTY[x.difficulty]) x.difficulty='normal';
      if(typeof x.dmg!=='number') x.dmg=DIFFICULTY[x.difficulty].dmg;
    });
  });
  return state;
}

function money(n){return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function historyProgress(v){return typeof v==='object'&&v!==null?Number(v.progress||0):Number(v||0)}
function historyXP(v){return typeof v==='object'&&v!==null?Number(v.xpEarned??v.xp??0):0}
function historyCoins(v){return typeof v==='object'&&v!==null?Number(v.coinsEarned??v.coins??0):0}
function daysAgo(dateKey){
  const parts=String(dateKey||'').split('-').map(Number);
  if(parts.length!==3 || parts.some(n=>Number.isNaN(n))) return Infinity;
  const [y,m,d]=parts;
  const dayUTC=Date.UTC(y,m-1,d,12,0,0);
  return Math.floor((Date.now()-dayUTC)/86400000);
}
function weekAvg(){return avg(Object.entries(S.history||{}).filter(([d])=>daysAgo(d)<7).map(x=>historyProgress(x[1])))}
function monthAvg(){
  const [ny,nm]=today().split('-'); // today() já é fixo em horário de Brasília.
  const prefix=`${ny}-${nm}`;
  return avg(Object.entries(S.history||{}).filter(([d])=>d.startsWith(prefix)).map(x=>historyProgress(x[1])));
}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+Number(y),0)/a.length):0}
function dateKeyMinusDays(n){
  const [y,m,d]=today().split('-').map(Number);
  const anchor=new Date(Date.UTC(y,m-1,d,12,0,0));
  anchor.setUTCDate(anchor.getUTCDate()-n);
  return `${anchor.getUTCFullYear()}-${String(anchor.getUTCMonth()+1).padStart(2,'0')}-${String(anchor.getUTCDate()).padStart(2,'0')}`;
}
function calendar(){let out='<div class="calendar">'+['D','S','T','Q','Q','S','S'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=29;i>=0;i--){let k=dateKeyMinusDays(i),v=historyProgress(S.history[k]),tier=calculateDailyReward(v).tier;let cls=tier==='perfect'?'perfect':tier==='excellent'?'perfect':tier==='complete'?'good':v>0?'bad':'';out+=`<div class="day ${cls}" title="${k}: ${v}%">${v||''}</div>`}return out+'</div>'}
function historyTable(){
  let a=Object.entries(S.history||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,365);
  if(!a.length)return '<div class="empty">Ainda não há histórico.</div>';
  return '<div class="history-list">'+a.map(([date,value],i)=>{
    let p=historyProgress(value),xp=historyXP(value),coins=historyCoins(value);
    let hasLedger = typeof value==='object' && value && value.startXp!==undefined && value.endXp!==undefined;
    let progressionBlock = hasLedger
      ? `<div><span>📈 XP no dia</span><strong>${fmt(value.startXp)} → ${fmt(value.endXp)}</strong></div><div><span>🏅 Nível</span><strong>${value.startLevel===value.endLevel?value.endLevel:`${value.startLevel} → ${value.endLevel}`}</strong></div>`
      : `<div><span>📈 Detalhamento</span><strong class="muted">Sem dados detalhados</strong></div>`;
    return `<details class="history-day" ${i===0?'open':''}><summary><b>${date}</b><strong>${p}%</strong><span>${p>=100?'🏆 Perfeito':p>=80?'✅ Qualificado':'—'}</span></summary><div class="history-day-content"><div class="history-stats"><div><span>⭐ XP ganho</span><strong>+${fmt(xp)}</strong></div><div><span>🪙 Gold ganho</span><strong>+${fmt(coins)}</strong></div><div><span>📊 Progresso</span><strong>${p}%</strong></div>${progressionBlock}</div>${historyTaskDetails(value)}</div></details>`;
  }).join('')+'</div>';
}
function historyTaskDetails(v){let t=v?.tasks;if(!t)return '<div class="muted">Registro antigo sem detalhamento das tarefas.</div>';let groups=[['🧼 Higiene',t.hygiene],['🎓 Faculdade',t.college],['🏠 Casa',t.houseTasks],['🔄 Hábitos',t.habits],['🎯 Tarefas',t.tasks],['🥗 Nutrição',t.nutrition],['⚔️ Missões',t.quests]].filter(x=>Array.isArray(x[1])&&x[1].length);return '<div class="history-task-groups">'+groups.map(([name,list])=>'<div class="history-task-group"><h4>'+name+'</h4>'+list.map(x=>{let done=!!(x.completed||x.done);return '<div class="history-task '+(done?'':'pending')+'">'+(done?'✅':'❌')+' '+esc(x.name||'Tarefa')+'</div>'}).join('')+'</div>').join('')+'</div>'}
function historyView(){let a=Object.entries(S.history||{}),xp=a.reduce((s,[,v])=>s+historyXP(v),0),coins=a.reduce((s,[,v])=>s+historyCoins(v),0),perfect=a.filter(([,v])=>historyProgress(v)>=100).length;return `${baseHeader('📜 Histórico','Seu diário de evolução, salvo na nuvem.')}<div class="grid"><div class="card"><span class="label">Dias registrados</span><div class="value">${a.length}</div></div><div class="card"><span class="label">Dias perfeitos</span><div class="value gold">${perfect}</div></div><div class="card"><span class="label">XP registrado</span><div class="value">${fmt(xp)}</div></div><div class="card"><span class="label">Gold registrado</span><div class="value gold">${fmt(coins)}</div></div></div><div class="card" style="margin-top:18px"><h3>📖 Diário de evolução</h3><p class="muted" style="font-size:.75rem;margin-top:4px">Os nomes de tarefas/hábitos/missões abaixo refletem como cada item se chamava no dia registrado — renomear um item hoje não altera os registros já arquivados.</p><div style="margin-top:15px">${historyTable()}</div></div>`}

function showAuth(mode='login',message=''){const o=document.getElementById('authOverlay');o.style.display='flex';o.innerHTML=`<div class="auth-box"><h1>⚔️ ELITEDASH</h1><p>${mode==='login'?'Entre para carregar seu personagem da nuvem.':'Crie sua conta para salvar seu progresso online.'}</p><input id="authEmail" type="email" placeholder="E-mail"><input id="authPassword" type="password" placeholder="Senha"><button class="btn primary" id="authSubmit">${mode==='login'?'Entrar':'Criar conta'}</button><div class="auth-msg">${message}</div><div class="auth-switch"><button id="authToggle">${mode==='login'?'Criar minha conta':'Já tenho uma conta'}</button></div></div>`;document.getElementById('authSubmit').onclick=async()=>{let email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||!password)return showAuth(mode,'Preencha e-mail e senha.');let r=mode==='login'?await supabaseClient.auth.signInWithPassword({email,password}):await supabaseClient.auth.signUp({email,password});if(r.error)return showAuth(mode,r.error.message);if(mode==='login'){currentUser=r.data.user;await loadCloud();checkDailyReset();checkWeeklyReset();checkPetUnlocks();render('today');o.style.display='none';}else{showAuth('login','Conta criada. Se o Supabase pedir confirmação por e-mail, confirme e depois entre.')}};document.getElementById('authToggle').onclick=()=>showAuth(mode==='login'?'signup':'login')}
async function logout(){
  await supabaseClient.auth.signOut();
  clearTimeout(cloudSaveTimer);
  currentUser=null;
  lastKnownCloudUpdatedAt=null;
  // Limpa o estado EM MEMÓRIA (não mexe no Supabase nem no localStorage do usuário
  // que acabou de sair) para impedir que, se outra conta fizer login nesta mesma aba
  // sem recarregar a página, ela herde os dados do usuário anterior.
  S=clone(defaultState);
  showAuth('login','Você saiu da conta.');
}

function render(tabName='today'){
  nav(tabName);
  document.getElementById('app').innerHTML = views[tabName]();
  bind();
  refreshRewardBanner();
  if(location.hash.slice(1)!==tabName) history.replaceState(null,'','#'+tabName);
}

 const addQ=document.getElementById('addQuest');if(addQ)addQ.onclick=()=>{let n=document.getElementById('newQuest').value.trim().slice(0,60);if(!n)return;let cat=document.getElementById('questCat').value;let attr=document.getElementById('questAttr').value;let diff=document.getElementById('questDiff').value;S.quests.push({id:uid('q'),name:n,category:cat,xp:Number(document.getElementById('questXp').value)||50,attr,difficulty:diff,dmg:DIFFICULTY[diff]?.dmg||10,done:false});save();render('quests')};
 const addT=document.getElementById('addTaskBtn');if(addT)addT.onclick=()=>{let n=document.getElementById('newTaskName').value.trim().slice(0,60);if(!n)return;let cat=document.getElementById('newTaskCat').value;let attr=document.getElementById('newTaskAttr').value;let diff=document.getElementById('newTaskDiff').value;S.tasks.push({id:uid('t'),name:n,category:cat,attr,difficulty:diff,dmg:DIFFICULTY[diff]?.dmg||10,xp:Number(document.getElementById('newTaskXp').value)||30,done:false});save();render('today')};

 document.querySelectorAll('[data-delbook]').forEach(e=>e.onclick=()=>{const id=e.dataset.delbook;const idx=S.books.findIndex(b=>b.id===id);if(idx===-1)return;if(!confirm(`Remover "${S.books[idx].name}"?`))return;S.books.splice(idx,1);save();render('knowledge')});

 document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>{let c=Number(e.dataset.cost);if(S.player.coins<c)return toast('Ouro insuficiente');S.player.coins-=c;S.inventory.push(e.dataset.buy);save();render('store');toast('Recompensa resgatada!')});
 document.querySelectorAll('[data-buyequip]').forEach(e=>e.onclick=()=>{
   const id=e.dataset.buyequip;
   const item=EQUIPMENT_CATALOG.find(x=>x.id===id);
   if(!item || S.avatar.owned.includes(id)) return;
   if(S.player.level < item.minLevel) return toast(`Requer nível ${item.minLevel}.`);
   if(S.player.coins < item.cost) return toast('Ouro insuficiente.');
   S.player.coins -= item.cost;
   S.avatar.owned.push(id);
   save();
   render('avatar');
   toast(`⚔️ ${item.name} adquirido!`);
 });

function toast(msg){let c=document.getElementById('toast');c.innerHTML=`<div class="toast"><b>Honra Conquistada</b><span>${msg}</span></div>`;setTimeout(()=>c.innerHTML='',3500)}

(async function initEliteDash(){
  const {data}=await supabaseClient.auth.getSession();
  currentUser=data?.session?.user||null;
  if(!currentUser){showAuth('login');return;}
  await loadCloud();
  checkDailyReset();
  checkWeeklyReset();
  checkPetUnlocks();
  render(location.hash.slice(1) && views[location.hash.slice(1)] ? location.hash.slice(1) : 'today');
})();

window.addEventListener('hashchange', ()=>{
  const t = location.hash.slice(1);
  if(currentUser && t && views[t]) render(t);
});

// Pressionar Enter em qualquer input de "novo item" aciona o botão Adicionar do mesmo formulário.
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter') return;
  const el=e.target;
  if(!el || el.tagName!=='INPUT') return;
  const form = el.closest('.form');
  if(!form) return;
  const btn = form.querySelector('button.primary, [data-addlist]');
  if(btn){ e.preventDefault(); btn.click(); }
});
