<script>

function calculateDailyReward(progress) {
    if (progress < 80) {
        return { xp: 0, coins: 0, tier: 'none', label: 'Meta não atingida' };
    }
    if (progress < 90) {
        return { xp: 100, coins: 100, tier: 'complete', label: 'Dia concluído' };
    }
    if (progress < 100) {
        return { xp: 150, coins: 150, tier: 'excellent', label: 'Excelente' };
    }
    return { xp: 250, coins: 250, tier: 'perfect', label: 'Dia perfeito' };
}

function getDailyRewardStatus(progress) {
    if (progress < 80) {
        return {
            eligible: false,
            xp: 0,
            coins: 0,
            message: `Faltam ${Math.max(0, 80 - progress)}% para garantir sua recompensa.`
        };
    }
    const reward = calculateDailyReward(progress);
    return {
        eligible: true,
        xp: reward.xp,
        coins: reward.coins,
        message: `${reward.label}: +${reward.xp} XP e +${reward.coins} Ouro`
    };
}

function refreshRewardBanner(){
    const el = document.getElementById('dailyRewardStatus');
    if(!el || typeof daily !== 'function') return;
    const progress = daily();
    const st = getDailyRewardStatus(progress);
    const claimed = (typeof S !== 'undefined' && S.player && S.player.dailyRewardClaimed);
    el.innerHTML = `<div class="reward-label">🎯 Progresso de hoje: ${progress}%</div>`
      + `<div class="reward-sub">${claimed ? '✅ Recompensa do dia já garantida.' : st.message}</div>`;
}

function uid(prefix){
  if(window.crypto && crypto.randomUUID) return prefix+'_'+crypto.randomUUID();
  return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}
function ensureIds(state){
  ['hygiene','college','houseTasks','habits','tasks','nutrition','quests','books'].forEach(k=>{
    if(Array.isArray(state[k])) state[k].forEach(x=>{ if(!x.id) x.id=uid(k[0]); });
  });
  return state;
}

function renameListItem(listKey, id, tab){
  const list = S[listKey];
  if(!list) return;
  const idx = list.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const cur = list[idx].name || '';
  const input = prompt('Novo nome:', cur);
  if(input===null) return;
  const n = input.trim().slice(0,60);
  if(!n) return;
  list[idx].name = n;
  save();
  render(tab);
}

function deleteListItem(listKey, id, tab){
  const list = S[listKey];
  if(!list) return;
  const idx = list.findIndex(x=>x.id===id);
  if(idx===-1) return;
  if(!confirm(`Remover "${list[idx].name}"? Essa ação não pode ser desfeita.`)) return;
  list.splice(idx,1);
  save();
  render(tab);
}

function renameBook(id){
  const idx = S.books.findIndex(b=>b.id===id);
  if(idx===-1) return;
  const book = S.books[idx];
  const newName = prompt('Título do livro:', book.name);
  if(newName===null) return;
  const n = newName.trim().slice(0,80);
  if(!n) return;
  const newAuthor = prompt('Autor:', book.author||'');
  if(newAuthor===null) return;
  book.name = n;
  book.author = newAuthor.trim().slice(0,80);
  save();
  render('knowledge');
}

function mergeState(base, saved){
  if(Array.isArray(saved)) return clone(saved);
  if(saved && typeof saved==='object'){
    const out={...(base && typeof base==='object' ? base : {})};
    Object.keys(saved).forEach(k=>{
      out[k]=mergeState(out[k],saved[k]);
    });
    return out;
  }
  return saved===undefined ? clone(base) : saved;
}

function normalizeState(saved){
  const state=mergeState(clone(defaultState),saved||{});
  if(!state.history) state.history={};
  if(!state.quests) state.quests=[];
  if(!state.inventory) state.inventory=[];
  return ensureIds(state);
}

function petBuffValue(p){
  const base=PET_RARITY_BASE[p.rarity]||2;
  return base + (p.level-1)*0.6;

function petBuffPct(kind, attr){
  let total=0;
  (S.pets||[]).filter(p=>p.active).forEach(p=>{
    const val=petBuffValue(p);
    if(kind==='gold' && p.buffType==='gold') total+=val;
    if(kind==='xp'){
      if(p.buffType==='xp_all') total+=val;
      if(attr && p.buffType==='xp_'+attr) total+=val;
    }
  });
  return total;
}

function petXpGain(amount){
  (S.pets||[]).filter(p=>p.active).forEach(p=>{
    if(p.level>=10) return;
    p.xp+=amount;
    while(p.xp>=p.xpToNext && p.level<10){
      p.xp-=p.xpToNext;
      p.level++;
      p.xpToNext=20+(p.level-1)*15;
      toast(`🐾 ${p.name} subiu para o nível ${p.level}!`);
    }
    if(p.level>=10) p.xp=0;
  });
}

function isoWeekKey(d=new Date()){
  const t=new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1=new Date(t.getFullYear(),0,4);
  return t.getFullYear()+'-W'+(1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7));
}

function checkWeeklyReset(){
  const wk = isoWeekKey();
  if(S.boss.week !== wk){
    S.boss.week = wk;
    S.boss.bonusClaimed = false;
    S.boss.items.forEach(i=>i.done=false);
    save();
  }
}

function checkDailyReset() {
  const d = today();
  if(!S.meta) S.meta = {lastCheckedDate:null};
  const lastActive = S.meta.lastCheckedDate;

  if (S.player.lastQualifiedDay !== d && S.player.dailyRewardClaimed) {
    S.player.dailyRewardClaimed = false;
  }

  // Primeira abertura (nesta conta, em qualquer dispositivo): apenas registra e já contabiliza o dia.
  if(!lastActive){
    S.meta.lastCheckedDate = d;
    recordToday();
    save();
    return;
  }

  // Novo dia: arquiva o anterior e reseta SOMENTE as tarefas diárias.
  // Usa S.meta (sincronizado na nuvem) em vez de localStorage, para funcionar
  // corretamente mesmo ao trocar de dispositivo/navegador.
  if(lastActive !== d){
    archiveCurrentDay(lastActive);
    resetDailyTasks();
    S.meta.lastCheckedDate = d;
    recordToday();
    save();
  }else{
    recordToday();
  }
}

}

function money(n){return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function historyProgress(v){return typeof v==='object'&&v!==null?Number(v.progress||0):Number(v||0)}
function historyXP(v){return typeof v==='object'&&v!==null?Number(v.xp||0):0}
function historyCoins(v){return typeof v==='object'&&v!==null?Number(v.coins||0):0}
function weekAvg(){return avg(Object.entries(S.history||{}).filter(([d])=>daysAgo(d)<7).map(x=>historyProgress(x[1])))}
function monthAvg(){let n=new Date();return avg(Object.entries(S.history||{}).filter(([d])=>{let x=new Date(d+'T12:00:00');return x.getFullYear()===n.getFullYear()&&x.getMonth()===n.getMonth()}).map(x=>historyProgress(x[1])))}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+Number(y),0)/a.length):0}
function daysAgo(d){return Math.floor((new Date()-new Date(d+'T12:00:00'))/86400000)}
function historyTaskDetails(v){let t=v?.tasks;if(!t)return '<div class="muted">Registro antigo sem detalhamento das tarefas.</div>';let groups=[['🧼 Higiene',t.hygiene],['🎓 Faculdade',t.college],['🏠 Casa',t.houseTasks],['🔄 Hábitos',t.habits],['🎯 Tarefas',t.tasks],['🥗 Nutrição',t.nutrition],['⚔️ Missões',t.quests]].filter(x=>Array.isArray(x[1])&&x[1].length);return '<div class="history-task-groups">'+groups.map(([name,list])=>'<div class="history-task-group"><h4>'+name+'</h4>'+list.map(x=>{let done=!!(x.completed||x.done);return '<div class="history-task '+(done?'':'pending')+'">'+(done?'✅':'❌')+' '+esc(x.name||'Tarefa')+'</div>'}).join('')+'</div>').join('')+'</div>'}
function calendar(){let out='<div class="calendar">'+['D','S','T','Q','Q','S','S'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=29;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10),v=historyProgress(S.history[k]),tier=calculateDailyReward(v).tier;let cls=tier==='perfect'?'perfect':tier==='excellent'?'perfect':tier==='complete'?'good':v>0?'bad':'';out+=`<div class="day ${cls}" title="${k}: ${v}%">${v||''}</div>`}return out+'</div>'}
function historyTable(){let a=Object.entries(S.history||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,365);if(!a.length)return '<div class="empty">Ainda não há histórico.</div>';return '<div class="history-list">'+a.map(([date,value],i)=>{let p=historyProgress(value),xp=historyXP(value),coins=historyCoins(value);return `<details class="history-day" ${i===0?'open':''}><summary><b>${date}</b><strong>${p}%</strong><span>${p>=100?'🏆 Perfeito':p>=80?'✅ Qualificado':'—'}</span></summary><div class="history-day-content"><div class="history-stats"><div><span>⭐ XP</span><strong>+${fmt(xp)}</strong></div><div><span>🪙 Gold</span><strong>${fmt(coins)}</strong></div><div><span>📊 Progresso</span><strong>${p}%</strong></div><div><span>👤 Nível</span><strong>${typeof value==='object'&&value?value.level:'—'}</strong></div></div>${historyTaskDetails(value)}</div></details>`}).join('')+'</div>'}
function historyView(){let a=Object.entries(S.history||{}),xp=a.reduce((s,[,v])=>s+historyXP(v),0),coins=a.reduce((s,[,v])=>s+historyCoins(v),0),perfect=a.filter(([,v])=>historyProgress(v)>=100).length;return `${baseHeader('📜 Histórico','Seu diário de evolução, salvo na nuvem.')}<div class="grid"><div class="card"><span class="label">Dias registrados</span><div class="value">${a.length}</div></div><div class="card"><span class="label">Dias perfeitos</span><div class="value gold">${perfect}</div></div><div class="card"><span class="label">XP registrado</span><div class="value">${fmt(xp)}</div></div><div class="card"><span class="label">Gold registrado</span><div class="value gold">${fmt(coins)}</div></div></div><div class="card" style="margin-top:18px"><h3>📖 Diário de evolução</h3><p class="muted" style="font-size:.75rem;margin-top:4px">Os nomes de tarefas/hábitos/missões abaixo refletem como cada item se chamava no dia registrado — renomear um item hoje não altera os registros já arquivados.</p><div style="margin-top:15px">${historyTable()}</div></div>`}

function bossView(){let done=S.boss.items.filter(x=>x.done).length,p=pct(done,S.boss.items.length);return `<div class="row"><div><div class="badge gold">👹 BOSS DA SEMANA</div><h2 style="margin-top:9px">O Destruidor da Procrastinação</h2></div><div class="boss-hp">${p}%</div></div><div class="progress"><div class="fill gold" style="width:${p}%"></div></div><div class="boss-tasks">${S.boss.items.map((x,i)=>`<label class="boss-task"><input type="checkbox" data-boss="${i}" ${x.done?'checked':''}> ${x.name}</label>`).join('')}</div>${p===100&&!S.boss.bonusClaimed?'<button class="btn primary" id="claimBoss" style="margin-top:15px">🏆 Derrotar Boss — +500 XP / +1.000 Ouro</button>':''}`}

function showAuth(mode='login',message=''){const o=document.getElementById('authOverlay');o.style.display='flex';o.innerHTML=`<div class="auth-box"><h1>⚔️ ELITEDASH</h1><p>${mode==='login'?'Entre para carregar seu personagem da nuvem.':'Crie sua conta para salvar seu progresso online.'}</p><input id="authEmail" type="email" placeholder="E-mail"><input id="authPassword" type="password" placeholder="Senha"><button class="btn primary" id="authSubmit">${mode==='login'?'Entrar':'Criar conta'}</button><div class="auth-msg">${message}</div><div class="auth-switch"><button id="authToggle">${mode==='login'?'Criar minha conta':'Já tenho uma conta'}</button></div></div>`;document.getElementById('authSubmit').onclick=async()=>{let email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||!password)return showAuth(mode,'Preencha e-mail e senha.');let r=mode==='login'?await supabaseClient.auth.signInWithPassword({email,password}):await supabaseClient.auth.signUp({email,password});if(r.error)return showAuth(mode,r.error.message);if(mode==='login'){currentUser=r.data.user;await loadCloud();checkDailyReset();render('today');o.style.display='none';setupLogoutButton();}else{showAuth('login','Conta criada. Se o Supabase pedir confirmação por e-mail, confirme e depois entre.')}};document.getElementById('authToggle').onclick=()=>showAuth(mode==='login'?'signup':'login')}
async function logout(){await supabaseClient.auth.signOut();currentUser=null;showAuth('login','Você saiu da conta.');}

function render(tabName='today'){
  nav(tabName);
  document.getElementById('app').innerHTML = views[tabName]();
  bind();
  refreshRewardBanner();
  if(location.hash.slice(1)!==tabName) history.replaceState(null,'','#'+tabName);
}

function bind(){
 document.querySelectorAll('[data-task]').forEach(e=>e.onchange=()=>{
 let x=S.tasks.find(t=>t.id===e.dataset.task);
 if(!x) return;
 x.done=e.checked;
 if(x.done) petXpGain(4);
 streakUpdate();
 save();
 render('today');
});
 document.querySelectorAll('[data-habit]').forEach(e=>e.onchange=()=>{
 let x=S.habits.find(t=>t.id===e.dataset.habit);
 if(!x) return;
 x.completed=e.checked;
 if(x.completed) petXpGain(3);
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-hygiene]').forEach(e=>e.onchange=()=>{
 let x=S.hygiene.find(t=>t.id===e.dataset.hygiene);
 if(!x) return;
 x.completed=e.checked;
 if(x.completed) petXpGain(2);
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-college]').forEach(e=>e.onchange=()=>{
 let x=S.college.find(t=>t.id===e.dataset.college);
 if(!x) return;
 x.completed=e.checked;
 if(x.completed) petXpGain(3);
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-housetask]').forEach(e=>e.onchange=()=>{
 let x=S.houseTasks.find(t=>t.id===e.dataset.housetask);
 if(!x) return;
 x.completed=e.checked;
 if(x.completed) petXpGain(2);
 streakUpdate();
 save();
 render('habits');
});
 document.querySelectorAll('[data-nutrition]').forEach(e=>e.onchange=()=>{
 let x=S.nutrition.find(t=>t.id===e.dataset.nutrition);
 if(!x) return;
 x.completed=e.checked;
 if(x.completed) petXpGain(2);
 streakUpdate();
 save();
 render('nutrition');
});
 document.querySelectorAll('[data-quest]').forEach(e=>e.onchange=()=>{
 let x=S.quests.find(t=>t.id===e.dataset.quest);
 if(!x) return;
 x.done=e.checked;
 if(x.done) petXpGain(5);
 save();
 render('quests');
});
 const addQ=document.getElementById('addQuest');if(addQ)addQ.onclick=()=>{let n=document.getElementById('newQuest').value.trim().slice(0,60);if(!n)return;let cat=document.getElementById('questCat').value;let attr=document.getElementById('questAttr').value;S.quests.push({id:uid('q'),name:n,category:cat,xp:Number(document.getElementById('questXp').value)||50,attr,done:false});save();render('quests')};
 const addT=document.getElementById('addTaskBtn');if(addT)addT.onclick=()=>{let n=document.getElementById('newTaskName').value.trim().slice(0,60);if(!n)return;let cat=document.getElementById('newTaskCat').value;let attr=document.getElementById('newTaskAttr').value;S.tasks.push({id:uid('t'),name:n,category:cat,attr,xp:Number(document.getElementById('newTaskXp').value)||30,done:false});save();render('today')};
 document.querySelectorAll('[data-addlist]').forEach(e=>e.onclick=()=>{
   const listKey = e.dataset.addlist;
   const tab = e.dataset.addtab || 'habits';
   const nameInput = document.getElementById('new_'+listKey+'_name');
   const n = nameInput ? nameInput.value.trim().slice(0,60) : '';
   if(!n) return;
   const item = { id: uid(listKey[0]), name: n, completed: false };
   if(e.dataset.addattr){
     const attrSel = document.getElementById('new_'+listKey+'_attr');
     const xpInput = document.getElementById('new_'+listKey+'_xp');
     item.attr = attrSel ? attrSel.value : 'discipline';
     item.xp = xpInput ? (Number(xpInput.value)||8) : 8;
   }
   S[listKey].push(item);
   save();
   render(tab);
 });
 const addB=document.getElementById('addBook');if(addB)addB.onclick=()=>{let n=document.getElementById('bookName').value.trim();if(!n)return;S.books.push({id:uid('bk'),name:n,author:document.getElementById('bookAuthor').value.trim()});xpGain(50,'knowledge');S.attributes.culture=Math.min(100,S.attributes.culture+2);addGold(50);checkPetUnlocks();save();render('knowledge');toast('Livro registrado: +50 XP e +50 Ouro')};
 document.querySelectorAll('[data-delbook]').forEach(e=>e.onclick=()=>{const id=e.dataset.delbook;const idx=S.books.findIndex(b=>b.id===id);if(idx===-1)return;if(!confirm(`Remover "${S.books[idx].name}"?`))return;S.books.splice(idx,1);save();render('knowledge')});
 document.querySelectorAll('[data-fin]').forEach(e=>e.onclick=()=>{S.finances.goals[e.dataset.fin].current=Math.max(0,S.finances.goals[e.dataset.fin].current+Number(e.dataset.d));save();render('finance')});
 const sf=document.getElementById('saveFin');if(sf)sf.onclick=(e)=>{S.finances.balance=Number(document.getElementById('finBalance').value)||0;S.finances.reserve=Number(document.getElementById('finReserve').value)||0;S.finances.debt=Number(document.getElementById('finDebt').value)||0;S.attributes.finance=Math.min(100,S.attributes.finance+1);save();toast('Tesouraria atualizada');e.target.textContent='Salvo ✓';setTimeout(()=>render('finance'),900)};
 document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>{let c=Number(e.dataset.cost);if(S.player.coins<c)return toast('Ouro insuficiente');S.player.coins-=c;S.inventory.push(e.dataset.buy);save();render('store');toast('Recompensa resgatada!')});
 document.querySelectorAll('[data-buyequip]').forEach(e=>e.onclick=()=>{
   const id=e.dataset.buyequip;
   const item=EQUIPMENT_CATALOG.find(x=>x.id===id);
   if(!item || S.avatar.owned.includes(id)) return;
   if(S.player.level < item.minLevel) return toast(`Requer nível ${item.minLevel}.`);
   if(S.player.coins < item.cost) return toast('Ouro insuficiente.');
   S.player.coins -= item.cost;
   S.avatar.owned.push(id);
   save();
   render('avatar');
   toast(`⚔️ ${item.name} adquirido!`);
 });
 document.querySelectorAll('[data-boss]').forEach(e=>e.onchange=()=>{S.boss.items[e.dataset.boss].done=e.checked;save();render('quests')});
 const cb=document.getElementById('claimBoss');if(cb)cb.onclick=()=>{if(S.boss.items.every(x=>x.done)&&!S.boss.bonusClaimed){S.boss.bonusClaimed=true;S.player.bossDefeats=(S.player.bossDefeats||0)+1;xpGain(500,'discipline');addGold(1000);S.trophies.push('Destruidor da Procrastinação');grantBossEquipment();checkPetUnlocks();save();render('quests');toast('BOSS DERROTADO! +500 XP +1.000 Ouro')}};
}
function toast(msg){let c=document.getElementById('toast');c.innerHTML=`<div class="toast"><b>Honra Conquistada</b><span>${msg}</span></div>`;setTimeout(()=>c.innerHTML='',3500)}

(async function initEliteDash(){
  const {data}=await supabaseClient.auth.getSession();
  currentUser=data?.session?.user||null;
  if(!currentUser){showAuth('login');return;}
  await loadCloud();
  checkDailyReset();
  checkWeeklyReset();
  checkPetUnlocks();
  render(location.hash.slice(1) && views[location.hash.slice(1)] ? location.hash.slice(1) : 'today');
  setupLogoutButton();
})();

window.addEventListener('hashchange', ()=>{
  const t = location.hash.slice(1);
  if(currentUser && t && views[t]) render(t);
});

// Pressionar Enter em qualquer input de "novo item" aciona o botão Adicionar do mesmo formulário.
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter') return;
  const el=e.target;
  if(!el || el.tagName!=='INPUT') return;
  const form = el.closest('.form');
  if(!form) return;
  const btn = form.querySelector('button.primary, [data-addlist]');
  if(btn){ e.preventDefault(); btn.click(); }
});

// O botão de logout único vive dentro do menu lateral (nav()), que já chama
// logout() diretamente. Nenhum botão flutuante duplicado é mais necessário.
function setupLogoutButton(){}
</script>
